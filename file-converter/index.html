<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperwork: file converter</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Paperwork</h1><p>Convert files between formats, right in your browser.</p></header>
<main class="wrap">
  <label class="drop" id="drop">
    <strong>Drop files here or click to choose</strong>
    <span>PPTX, DOCX, PDF, TXT, Markdown, HTML, CSV, XLSX, images</span>
    <input type="file" id="pick" multiple hidden accept=".pptx,.pdf,.docx,.txt,.md,.markdown,.html,.htm,.csv,.tsv,.xlsx,.xls,.ods,image/*">
  </label>
  <ul id="list" class="list"></ul>
  <section class="opts">
    <label>Convert to <select id="fmt"><option value="pdf">PDF</option><option value="docx">DOCX</option><option value="html">HTML</option><option value="txt">TXT</option><option value="md">Markdown</option></select></label>
    <label>Page <select id="size"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option></select></label>
    <label>Orientation <select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>
    <label>Margin (mm) <input type="number" id="margin" value="15" min="5" max="50"></label>
  </section>
  <div class="act"><button class="primary" id="go" disabled>Convert and download</button><button id="clear">Clear</button><span id="msg" role="status"></span></div>
</main>
<footer class="foot">Made by Piyal Technologies</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.min.js"></script>
<script src="script.js"></script>
</body>
</html>
